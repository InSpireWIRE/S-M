<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S!M - Story !ntelligence Machine</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0A0A0A;
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 5rem;
            font-weight: 900;
            margin-bottom: 1rem;
        }
        .cyan { color: #00d4ff; }
        .tagline {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 3rem;
            letter-spacing: 2px;
        }
        .enter-btn {
            background: transparent;
            border: 2px solid #00d4ff;
            color: #00d4ff;
            padding: 1rem 3rem;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .enter-btn:hover {
            background: #00d4ff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>S<span class="cyan">!</span>M</h1>
        <p class="tagline">STORY INTELLIGENCE MACHINE</p>
        <button class="enter-btn" onclick="window.location.href='/login'">
            ENTER THE MACHINE
        </button>
    </div>
</body>
</html>
